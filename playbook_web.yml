---
- name: Configuration du serveur Web
  hosts: serveurs_web
  become: yes
  tasks:
    - name: Installation du paquet apache2
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Demarrage et activation du service
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Creation de la page d'accueil personnalisee
      copy:
        dest: /var/www/html/index.html
        content: |
          <html>
          <body>
          <h1>Bienvenue sur le Serveur Web de la DMZ (Configure par Ansible)</h1>
          </body>
          </html>
